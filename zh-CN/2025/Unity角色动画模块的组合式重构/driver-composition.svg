<svg xmlns="http://www.w3.org/2000/svg" width="700" height="385" viewBox="0 0 700 385" role="img" aria-label="角色实体以组合方式持有控制器和动画驱动器">
<title>角色实体以组合方式持有控制器和动画驱动器</title><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#26354a} .title{font-size:23px;font-weight:700}.label{font-size:20px}.note{font-size:16px;fill:#5d6c80}.small{font-size:17px}</style>
