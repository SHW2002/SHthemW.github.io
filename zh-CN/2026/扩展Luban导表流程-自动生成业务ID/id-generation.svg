<svg xmlns="http://www.w3.org/2000/svg" width="700" height="487" viewBox="0 0 700 487" role="img" aria-label="从 Luban 输出到业务 ID 常量的生成流程">
<title>从 Luban 输出到业务 ID 常量的生成流程</title><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#26354a} .title{font-size:23px;font-weight:700}.label{font-size:20px}.note{font-size:16px;fill:#5d6c80}.small{font-size:17px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718298"/></marker></defs>
<rect x="1" y="1" width="698" height="485" rx="16" fill="#f7f9fc" stroke="#dbe3ed"/>
<text x="350" y="42" class="title" text-anchor="middle">让配置与代码引用一起更新</text><rect x="75" y="78" width="550" height="64" rx="10" fill="#fff" stroke="#afc0d4"/><text x="350.0" y="117.0" class="label" text-anchor="middle">配置表 → Luban 导出数据</text><rect x="75" y="172" width="550" height="64" rx="10" fill="#fff" stroke="#afc0d4"/><text x="350.0" y="211.0" class="label" text-anchor="middle">各表生成器：选择、命名、校验</text><rect x="75" y="266" width="550" height="64" rx="10" fill="#e4edf9" stroke="#afc0d4"/><text x="350.0" y="305.0" class="label" text-anchor="middle">公共输出：格式、注释、按需写入</text><rect x="75" y="360" width="550" height="64" rx="10" fill="#fff" stroke="#afc0d4"/><text x="350.0" y="399.0" class="label" text-anchor="middle">C# 常量 / 枚举 → 编译检查</text><path d="M350 142 L350 168" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350 236 L350 262" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350 330 L350 356" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350" y="460" class="note" text-anchor="middle">输入与规则不变时，不重复改写生成文件</text></svg>