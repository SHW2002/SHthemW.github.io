<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">直接跟随朝向的站位点在急转时换到另一侧</title><desc id="desc">红色三角身图标表示发起方，蓝色菱形身图标表示接收方，按正文逐步引入其余对象。</desc>
<rect width="900" height="570" fill="#FFFFFF"/>
<defs>
<marker id="k" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5L0 10Z" fill="#000000"/></marker>
<marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5L0 10Z" fill="#FF0000"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5L0 10Z" fill="#0000FF"/></marker>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
<text x="855" y="43" fill="#000000" font-size="28" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="end">突然右转后</text>
<g data-role="initiator" data-x="580.0000" data-y="290.0000" transform="translate(580.00 290.00)">
<circle cx="0.00" cy="-51.00" r="8" fill="none" stroke="#FF0000" stroke-width="2"/>
<path d="M0.00 -37.00L-18.00 -12.00L18.00 -12.00L0.00 -37.00" fill="none" stroke="#FF0000" stroke-width="3"/>
<path d="M-7.00 -12.00L-13.00 0.00" fill="none" stroke="#FF0000" stroke-width="3"/>
<path d="M7.00 -12.00L13.00 0.00" fill="none" stroke="#FF0000" stroke-width="3"/>
</g>
<text x="580" y="335" fill="#FF0000" font-size="32" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">发起方</text>
<g data-role="recipient" data-x="398.5000" data-y="362.6000" transform="translate(398.50 362.60)">
<circle cx="0.00" cy="-51.00" r="8" fill="none" stroke="#0000FF" stroke-width="2"/>
<path d="M0.00 -37.00L-18.00 -23.00L0.00 -9.00L18.00 -23.00L0.00 -37.00" fill="none" stroke="#0000FF" stroke-width="3"/>
<path d="M-7.00 -12.00L-13.00 0.00" fill="none" stroke="#0000FF" stroke-width="3"/>
<path d="M7.00 -12.00L13.00 0.00" fill="none" stroke="#0000FF" stroke-width="3"/>
</g>
<text x="398.5" y="407.6" fill="#0000FF" font-size="32" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">接收方</text>
<path d="M498.40 108.50L516.40 108.50" fill="none" stroke="#000000" stroke-width="3"/>
<path d="M507.40 99.50L507.40 117.50" fill="none" stroke="#000000" stroke-width="3"/>
<path d="M615.00 290.00L800.00 290.00" fill="none" stroke="#FF0000" stroke-width="3" marker-end="url(#r)"/>
<text x="648" y="235" fill="#FF0000" font-size="29" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="start">朝向</text>
<path d="M398.50 362.60L507.40 108.50" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="9 9" marker-end="url(#k)"/>
<text x="238" y="171" fill="#000000" font-size="29" font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="start">站位点</text>
<path d="M360.00 166.00L507.40 108.50" fill="none" stroke="#000000" stroke-width="1"/>
</g>
