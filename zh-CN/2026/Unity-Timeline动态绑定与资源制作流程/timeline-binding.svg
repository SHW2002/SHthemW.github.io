<svg xmlns="http://www.w3.org/2000/svg" width="700" height="485" viewBox="0 0 700 485" role="img" aria-label="Timeline 绑定信息的导出与运行时恢复">
<title>Timeline 绑定信息的导出与运行时恢复</title><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#26354a} .title{font-size:23px;font-weight:700}.label{font-size:20px}.note{font-size:16px;fill:#5d6c80}.small{font-size:17px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718298"/></marker></defs>
<rect x="1" y="1" width="698" height="483" rx="16" fill="#f7f9fc" stroke="#dbe3ed"/>
<text x="350" y="42" class="title" text-anchor="middle">同一份演出，两种使用阶段</text><text x="185" y="87" class="label" text-anchor="middle">编辑器制作</text><text x="515" y="87" class="label" text-anchor="middle">运行时播放</text><rect x="60" y="112" width="250" height="76" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="185.0" y="157.0" class="label" text-anchor="middle">Timeline + 场景绑定</text><rect x="390" y="112" width="250" height="76" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="515.0" y="157.0" class="label" text-anchor="middle">加载 Timeline</text><path d="M185 188 L185 227" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515 188 L515 227" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="234" width="250" height="76" rx="10" fill="#e4edf9" stroke="#afc0d4"/><text x="185.0" y="265.0" class="label" text-anchor="middle">导出绑定描述</text><text x="185.0" y="293.0" class="label" text-anchor="middle">清理直接引用</text><rect x="390" y="234" width="250" height="76" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="515.0" y="265.0" class="label" text-anchor="middle">场景对象索引</text><text x="515.0" y="293.0" class="label" text-anchor="middle">按路径与类型定位</text><path d="M310 270 L383 270" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515 310 L515 349" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="356" width="250" height="64" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="515.0" y="395.0" class="label" text-anchor="middle">SetGenericBinding</text><text x="185" y="382" class="note" text-anchor="middle">需要修改时可回读绑定</text><text x="350" y="458" class="note" text-anchor="middle">层级或轨道名变化后，重新导出并回归播放</text></svg>