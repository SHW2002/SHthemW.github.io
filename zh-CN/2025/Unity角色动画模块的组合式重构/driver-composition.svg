<text x="350" y="42" class="title" text-anchor="middle">实体组合两种独立的能力</text><rect x="235" y="72" width="230" height="64" rx="10" fill="#e4edf9" stroke="#afc0d4"/><text x="350.0" y="111.0" class="label" text-anchor="middle">PlayerEntity</text><path d="M290 136 L185 190" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M410 136 L515 190" fill="none" stroke="#718298" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="65" y="194" width="240" height="80" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="185.0" y="227.0" class="label" text-anchor="middle">Controller</text><text x="185.0" y="255.0" class="label" text-anchor="middle">输入与移动</text><rect x="395" y="194" width="240" height="80" rx="10" fill="#ffffff" stroke="#afc0d4"/><text x="515.0" y="227.0" class="label" text-anchor="middle">AnimDriver</text><text x="515.0" y="255.0" class="label" text-anchor="middle">动画表现</text><text x="185" y="311" class="note" text-anchor="middle">本地 / 远端 / AI</text><text x="515" y="311" class="note" text-anchor="middle">参数驱动 / 状态驱动</text><text x="350" y="357" class="note" text-anchor="middle">由实体创建、更新与释放；各自实现自己的业务接口</text></svg>