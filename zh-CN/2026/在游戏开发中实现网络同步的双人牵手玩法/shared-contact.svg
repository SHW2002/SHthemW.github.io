<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">只增加两条手臂的可达范围，把握点约束到双方都能伸到的区域</title><desc id="desc">双方各有肩、肘、腕三个节点，骨长保持一致；本图只显示当前步骤需要的几何对象。</desc>
